footer:
    height: 0.5in
    line_height: 0.5
      #recto_content:
      #  left: ' *{page-number}* | {document-title} '
      #verso_content:
      #  right: ' {chapter-title} | *{page-number}* '
    padding: [10, 0, 0, 0]
    font:
        family: FooterFont
        size: 28
        style: normal
        color: #909095

role:
  strong-red:
    font-color: #d64502
  strong-blue:
    font-color: #0680d1

